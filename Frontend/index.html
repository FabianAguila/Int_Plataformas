<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
         
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #e0e7ef);
            color: #333;
            margin: 0;
            padding: 0;
        }

        form {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            padding: 30px;
            max-width: 500px;
            margin: 40px auto;
            border: 1px solid #dcdcdc;
        }

        form h1 {
            margin-top: 0;
            font-size: 24px;
            font-weight: 700;
            color: #007bff;
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #555;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #007bff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            color: #333;
        }

        input[readonly] {
            background-color: #f9f9f9;
        }

        button {
            background: linear-gradient(45deg, #28a745, #218838);
            color: #fff;
            padding: 14px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 500;
            text-transform: uppercase;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background 0.3s ease, transform 0.3s ease;
        }

        button:hover {
            background: linear-gradient(45deg, #218838, #1e7e34);
            transform: scale(1.05);
        }

        .boleta-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin: 40px auto;
            max-width: 600px;
            border: 1px solid #dcdcdc;
        }

        .boleta-container h2 {
            color: #007bff;
            margin-bottom: 20px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
        }

        .boleta-container p {
            font-size: 16px;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .boleta-container strong {
            color: #333;
            font-weight: 600;
        }

        .boleta-container span {
            color: #555;
            font-weight: 400;
        }

        input[type="number"]:focus,
        select:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
            outline: none;
        }

        button:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #6c757d, #5a6268);
            color: #fff;
            padding: 12px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            text-transform: uppercase;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .btn-secondary:hover {
            background: linear-gradient(45deg, #5a6268, #4e555b);
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            form, .boleta-container {
                padding: 20px;
                margin: 20px;
                max-width: 100%;
            }

            form h1 {
                font-size: 22px;
            }

            button, .btn-secondary {
                font-size: 16px;
                padding: 12px 0;
            }
        }
    </style>
</head>
<body>
    <form>
        <label for="cboCliente">Cliente</label>
        <select name="cboCliente" id="cboCliente"></select>
        <br><br>
        <label for="cboProducto">Producto</label>
        <select name="cboProducto" id="cboProducto"></select>
        <br><br>
        <label for="precioProducto">Precio Unitario</label>
        <input type="number" id="precioProducto" name="precioProducto" readonly>
        <br><br>
        <label for="txtCantidad">Cantidad</label>
        <input type="number" name="txtCantidad" id="txtCantidad" min="1" value="1">
        <br><br>
        <label for="totalCosto">Costo Total</label>
        <input type="number" id="totalCosto" name="totalCosto" readonly>
        <br><br>
        <button class="btn" id="btnEnviar" type="button">Enviar</button>
    </form>
    <div class="boletacontainer" id="boletaContainer">
        <h2>Boleta de Compra</h2>
        <p><strong>Cliente:</strong> <span id="boletaClienteNombre"></span></p>
        <p><strong>Dirección:</strong> <span id="boletaClienteDireccion"></span></p>
        <p><strong>Teléfono:</strong> <span id="boletaClienteTelefono"></span></p>
        <p><strong>Email:</strong> <span id="boletaClienteEmail"></span></p>
        <p><strong>Producto:</strong> <span id="boletaProductoNombre"></span></p>
        <p><strong>Precio Unitario:</strong> $<span id="boletaProductoPrecio"></span></p>
        <p><strong>Cantidad:</strong> <span id="boletaCantidad"></span></p>
        <p><strong>Total Costo:</strong> $<span id="boletaTotalCosto"></span></p>
    </div>
    <script type="text/javascript">
        async function cargarClientes() {
            const cboCliente = document.getElementById('cboCliente');
            try {
                const response = await fetch("http://localhost:5010/api/Cliente/ObtenerCli", { 
                    headers: { "Content-Type": "application/json" },
                    mode: 'cors'
                });
                const listaClientes = await response.json();
                let clienteOptions = '';
                listaClientes.forEach(cliente => {
                    clienteOptions += `<option value="${cliente.id}" data-direccion="${cliente.direccion}" data-telefono="${cliente.telefono}" data-email="${cliente.email}">${cliente.nombre}</option>`;
                });
                cboCliente.innerHTML = clienteOptions;
            } catch (error) { 
                console.error('Error fetching clients:', error);
            }
        }
        async function cargarProductos() {
            const cboProducto = document.getElementById('cboProducto');
            try {
                const response = await fetch("http://localhost:5010/api/Productos", { 
                    headers: { "Content-Type": "application/json" },
                    mode: 'cors'
                });
                const listaProductos = await response.json();
                let productosOptions = '';
                listaProductos.forEach(producto => {
                    productosOptions += `<option value="${producto.id}" data-precio="${producto.precio}" data-stock="${producto.stock}">${producto.nombre}</option>`;
                });
                cboProducto.innerHTML = productosOptions;
                cboProducto.addEventListener('change', actualizarPrecioProducto);
                if (listaProductos.length > 0) {
                    cboProducto.dispatchEvent(new Event('change'));
                }
            } catch (error) {
                console.error('Error fetching products:', error);
            }
        }
        function actualizarPrecioProducto() {
            const productoSeleccionado = document.getElementById('cboProducto');
            const precioProducto = productoSeleccionado.selectedOptions[0]?.getAttribute('data-precio');
            document.getElementById('precioProducto').value = precioProducto;
            actualizarTotalCosto();
        }

        function actualizarTotalCosto() {
            const precioProducto = parseFloat(document.getElementById('precioProducto').value);
            const cantidad = parseInt(document.getElementById('txtCantidad').value);
            if (!isNaN(precioProducto) && !isNaN(cantidad)) {
                document.getElementById('totalCosto').value = (precioProducto * cantidad).toFixed(2);
            } else {
                document.getElementById('totalCosto').value = '';
            }
        }
        async function enviarCompra() {
            const cboCliente = document.getElementById('cboCliente');
            const cboProducto = document.getElementById('cboProducto');
            const txtCantidad = document.getElementById('txtCantidad');
            const clienteSeleccionado = cboCliente.options[cboCliente.selectedIndex];
            const productoSeleccionado = cboProducto.options[cboProducto.selectedIndex];
            const precio = parseFloat(productoSeleccionado.getAttribute('data-precio'));
            const cantidad = parseInt(txtCantidad.value);
            const totalCosto = precio * cantidad;
            const stockProducto = parseInt(productoSeleccionado.getAttribute('data-stock'));

            if (isNaN(precio) || isNaN(cantidad) || cantidad <= 0) {
            alert('Por favor, asegúrate de que todos los campos son válidos.');
            return;
            }

            if (cantidad > stockProducto) {
            alert('La cantidad solicitada excede el stock disponible.');
            return;
        }
            const compra = {
                clienteId: parseInt(cboCliente.value),
                cliente: {
                    id: parseInt(cboCliente.value),
                    nombre: clienteSeleccionado.textContent,
                    direccion: clienteSeleccionado.getAttribute('data-direccion'),
                    telefono: clienteSeleccionado.getAttribute('data-telefono'),
                    email: clienteSeleccionado.getAttribute('data-email')
                },
                nombreCliente: clienteSeleccionado.textContent,
                direccionCliente: clienteSeleccionado.getAttribute('data-direccion'),
                telefonoCliente: clienteSeleccionado.getAttribute('data-telefono'),
                emailCliente: clienteSeleccionado.getAttribute('data-email'),
                productoId: parseInt(cboProducto.value),
                producto: {
                    id: parseInt(cboProducto.value),
                    nombre: productoSeleccionado.textContent,
                    precio: precio,
                    stock: stockProducto,
                    cantidad: cantidad
                },
                nombreProducto: productoSeleccionado.textContent,
                precioProducto: precio,
                stockProducto: stockProducto,
                cantidadProducto: cantidad,
                cantidad: cantidad,
                totalCosto: totalCosto
            };
            console.log('Datos de la compra:', JSON.stringify(compra, null, 2));
            try {
                const response = await fetch('http://localhost:5010/api/Compras', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(compra)
                });

                if (!response.ok) {
                    throw new Error(`http error status: ${response.status}`);
                }

                const data = await response.json();
                alert(`Compra realizada con éxito, el costo total es de: $${data.totalCosto}`);
            } catch (error) {
                console.error('Error:', error);
                alert('Error al realizar la compra. Revisa la consola para más detalles.');
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            cargarClientes();
            cargarProductos();
            document.getElementById('txtCantidad').addEventListener('input', actualizarPrecioProducto);
        });
        document.getElementById('txtCantidad').addEventListener('input', actualizarTotalCosto);
        document.getElementById('btnEnviar').addEventListener('click', enviarCompra);
    </script>
</body>
</html>

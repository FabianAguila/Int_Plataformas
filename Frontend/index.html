<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        form {
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 400px;
            margin: 20px auto;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #4caf50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .btn {
            display: block;
            width: 100%;
        }
    </style>
    
</head>
<body>
    <form>
        <label for="cboCliente">Cliente</label>
        <select name="cboCliente" id="cboCliente"></select>
        <br><br>
        <label for="cboProducto">Producto</label>
        <select name="cboProducto" id="cboProducto"></select>
        <br><br>
        <label for="txtCantidad">Cantidad</label>
        <input type="number" name="txtCantidad" id="txtCantidad" min="1">
        <br><br>
        <button class="btn" id="btnEnviar" type="button">Enviar</button>
    </form>

    <script type="text/javascript">
  async function cargarClientes() {
            const cboCliente = document.getElementById('cboCliente');
            try {
                const response = await fetch("http://localhost:5010/api/Cliente/ObtenerCli", { 
                    headers: { "Content-Type": "application/json" },
                    mode: 'cors'
                });
                const listaClientes = await response.json();
                let clienteOptions = '';
                listaClientes.forEach(cliente => {
                    clienteOptions += `<option value="${cliente.id}">${cliente.nombre}</option>`;
                });
                cboCliente.innerHTML = clienteOptions;
            } catch (error) { 
                console.error('Error fetching clients:', error);
            }
        };
        
        async function cargarProductos() {
            const cboProducto = document.getElementById('cboProducto');
            try {
                const response = await fetch("http://localhost:5010/api/Productos", { 
                    headers: { "Content-Type": "application/json" },
                    mode: 'cors'
                });
                const listaProductos = await response.json();
                let productosOptions = '';
                listaProductos.forEach(producto => {
                    productosOptions += `<option value="${producto.id}">${producto.nombre}">${producto.cantidad} data-precio = ${producto.totalCosto}</option>`;
                });
                cboProducto.innerHTML = productosOptions;
            } catch (error) {
                console.error('Error fetching products:', error);
            }
        }
        async function enviarCompra(){
            const cboCliente = document.getElementById('cboCliente');
            const cboProducto = document.getElementById('cboProducto');
            const txtCantidad = document.getElementById('txtCantidad');
            const productoSeleccionado = cboProducto.options[cboProducto.selectedIndex];
            const precio = parseFloat(productoSeleccionado.getAtribute('data-precio'));
            const cantidad = parseInt(txtCantidad.value);
            const totalCosto = precio * cantidad;
            const compra = {
                clienteId: parseInt(cboCliente.value),
                productoId: parseInt(cboProducto.value),
                cantidad: cantidad,
                totalCosto: totalCosto
            };
            try{
                const response = await fetch('https://apilogistica1.azurewebsites.net/api/Compras',{
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(compra)
                });
                
                if (response.ok){
                    const data = await response.json();
                    alert(`Compra realizada con exito, el costo total es de: ${data.totalCosto}`);
                } else {
                    alert('error al realizar la compra');
                }
                
            } catch (error) {
                console.error('error:', error);
                alert('Error al realizar la compra');
                }
        }

        document.getElementById('btnEnviar').addEventListener('click', enviarCompra)
    </script>
</body>
</html>
